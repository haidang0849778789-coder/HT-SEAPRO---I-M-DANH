
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#174b91">
<title>HT SEAPRO - Điểm danh nhân sự</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 14px;
  min-height: 100vh;
  background: #f0f3f8;
  font-family: Arial, Helvetica, sans-serif;
  color: #17243a;
}

.container {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  padding: 25px 20px;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 5px 25px rgba(0,0,0,.06);
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.brand {
  color: #174b91;
  font-size: 31px;
  font-weight: 800;
  letter-spacing: 2px;
}

.subtitle {
  color: #8994a3;
  font-size: 12px;
  margin-top: 8px;
  letter-spacing: 1px;
}

.status {
  padding: 15px 10px;
  border-radius: 10px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 23px;
  background: #f1f5f9;
  color: #64748b;
}

.status.ok {
  background: #e9f8ef;
  color: #16803d;
}

.status.error {
  background: #fff0f0;
  color: #dc2626;
}

.status.warning {
  background: #fff8e8;
  color: #a16207;
}

.section-title {
  color: #174b91;
  font-size: 16px;
  font-weight: 800;
  margin: 22px 0 13px;
}

.camera-frame {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: #111827;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
}

#camera {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.camera-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #cbd5e1;
  gap: 10px;
  text-align: center;
  padding: 20px;
  font-size: 13px;
}

.camera-placeholder.hidden {
  display: none;
}

.camera-message {
  text-align: center;
  color: #64748b;
  font-size: 13px;
  line-height: 1.6;
  margin: 12px 0 15px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  margin: 20px 0 9px;
}

input {
  width: 100%;
  min-height: 54px;
  padding: 13px 15px;
  border: 1px solid #dce2ea;
  border-radius: 11px;
  font-size: 17px;
  background: #fff;
  color: #17243a;
  outline: none;
}

input:focus {
  border-color: #174b91;
  box-shadow: 0 0 0 3px rgba(23,75,145,.09);
}

button {
  width: 100%;
  min-height: 55px;
  border: none;
  border-radius: 11px;
  padding: 14px;
  background: #174b91;
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 12px;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.secondary-button {
  background: #64748b;
}

.submit-button {
  margin-top: 24px;
  min-height: 60px;
  font-size: 17px;
}

.result {
  display: none;
  margin-top: 22px;
  padding: 19px;
  border: 1px solid #b7e5c5;
  border-radius: 13px;
  background: #effaf2;
}

.result-title {
  color: #16803d;
  font-size: 19px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 15px;
}

.result-row {
  font-size: 14px;
  line-height: 1.9;
  color: #334155;
  overflow-wrap: anywhere;
}

.zalo-note {
  text-align: center;
  color: #16803d;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 15px;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #9aa5b5;
  letter-spacing: 1px;
  margin-top: 28px;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="brand">HT SEAPRO</div>
    <div class="subtitle">
      HỆ THỐNG ĐIỂM DANH NHÂN SỰ
    </div>
  </div>

  <div id="wifiStatus" class="status">
    ĐANG KIỂM TRA MẠNG...
  </div>

  <div id="mainContent" class="hidden">

    <div class="section-title">
      01. XÁC NHẬN CÓ MẶT TẠI CÔNG TY
    </div>

    <div class="camera-frame">

      <video
        id="camera"
        autoplay
        playsinline
        muted>
      </video>

      <div id="cameraPlaceholder"
           class="camera-placeholder">
        <span style="font-size:40px">📷</span>
        <span>VUI LÒNG MỞ CAMERA ĐỂ XÁC NHẬN CÓ MẶT</span>
      </div>

    </div>

    <div id="cameraMessage" class="camera-message">
      Camera chưa được mở.
    </div>

    <button
      id="cameraButton"
      type="button"
      onclick="openCamera()">
      MỞ CAMERA
    </button>

    <div class="section-title">
      02. THÔNG TIN NHÂN SỰ
    </div>

    <label for="employeeName">
      HỌ VÀ TÊN NHÂN SỰ
    </label>

    <input
      id="employeeName"
      type="text"
      maxlength="100"
      placeholder="Nhập họ và tên..."
      autocomplete="name">

    <label for="selectedTime">
      03. GIỜ ĐIỂM DANH
    </label>

    <input
      id="selectedTime"
      type="time">

    <button
      id="submitButton"
      class="submit-button"
      type="button"
      onclick="submitAttendance()">
      ĐIỂM DANH
    </button>

    <div id="result" class="result">

      <div class="result-title">
        ✓ ĐIỂM DANH THÀNH CÔNG
      </div>

      <div id="resultInfo"></div>

      <div class="zalo-note">
        VUI LÒNG CHỤP MÀN HÌNH VÀ GỬI VÀO NHÓM ZALO QUẢN LÝ.
      </div>

    </div>

  </div>

  <div class="footer">
    HT SEAPRO ENTERTAINMENT
  </div>

</div>


<script>

/************************************************
 * 1. CẤU HÌNH HỆ THỐNG
 ************************************************/

const CONFIG = {
  COMPANY_IP: '113.161.37.230',

  // DÁN URL WEB APP GOOGLE APPS SCRIPT VÀO ĐÂY
  API_URL: 'DAN_URL_EXEC_CUA_BAN_VAO_DAY'
};

let cameraStream = null;
let wifiVerified = false;
let submitted = false;


/************************************************
 * 2. LẤY GIỜ HIỆN TẠI
 ************************************************/

function getCurrentTime() {

  const now = new Date();

  const hours = String(
    now.getHours()
  ).padStart(2, '0');

  const minutes = String(
    now.getMinutes()
  ).padStart(2, '0');

  return hours + ':' + minutes;
}


/************************************************
 * 3. KIỂM TRA WIFI CÔNG TY
 ************************************************/

async function checkWifi() {

  const status = document.getElementById('wifiStatus');
  const main = document.getElementById('mainContent');

  status.className = 'status';
  status.innerText = 'ĐANG KIỂM TRA WIFI CÔNG TY...';

  main.classList.add('hidden');

  wifiVerified = false;

  try {

    const response = await fetch(
      'https://api.ipify.org?format=json',
      {
        cache: 'no-store'
      }
    );

    if (!response.ok) {
      throw new Error('Không lấy được IP.');
    }

    const data = await response.json();

    if (data.ip === CONFIG.COMPANY_IP) {

      wifiVerified = true;

      status.className = 'status ok';

      status.innerText =
        '✓ ĐÃ KẾT NỐI WIFI HT SEAPRO';

      main.classList.remove('hidden');

      document.getElementById('selectedTime').value =
        getCurrentTime();

    } else {

      status.className = 'status error';

      status.innerText =
        'BẠN CHƯA KẾT NỐI WIFI CÔNG TY.';

    }

  } catch (error) {

    status.className = 'status error';

    status.innerText =
      'KHÔNG KIỂM TRA ĐƯỢC MẠNG. VUI LÒNG THỬ LẠI.';

    console.error(error);

  }

}


/************************************************
 * 4. MỞ CAMERA TRƯỚC
 ************************************************/

async function openCamera() {

  const video = document.getElementById('camera');

  const message = document.getElementById('cameraMessage');

  const button = document.getElementById('cameraButton');

  if (!wifiVerified) {

    message.innerText =
      'VUI LÒNG KẾT NỐI WIFI CÔNG TY.';

    return;
  }

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    message.innerText =
      'TRÌNH DUYỆT KHÔNG HỖ TRỢ CAMERA. HÃY DÙNG SAFARI HOẶC CHROME.';

    return;
  }

  button.disabled = true;
  message.innerText = 'ĐANG MỞ CAMERA...';

  try {

    stopCamera();

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: 'user'
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });

    video.srcObject = cameraStream;

    await video.play();

    document.getElementById('cameraPlaceholder')
      .classList.add('hidden');

    message.innerText =
      'CAMERA ĐANG HOẠT ĐỘNG. HÃY NHÌN THẲNG VÀO CAMERA.';

    button.innerText = 'CAMERA ĐÃ BẬT';

  } catch (error) {

    message.innerText =
      'KHÔNG MỞ ĐƯỢC CAMERA: ' +
      error.name +
      '. VUI LÒNG KIỂM TRA QUYỀN CAMERA.';

    console.error('Camera error:', error);

    button.innerText = 'THỬ MỞ CAMERA LẠI';

  } finally {

    button.disabled = false;

  }

}


/************************************************
 * 5. DỪNG CAMERA
 ************************************************/

function stopCamera() {

  if (cameraStream) {

    cameraStream.getTracks().forEach(function(track) {
      track.stop();
    });

    cameraStream = null;

  }

}


/************************************************
 * 6. HIỂN THỊ KẾT QUẢ AN TOÀN
 ************************************************/

function showResult(data) {

  const result = document.getElementById('result');

  const info = document.getElementById('resultInfo');

  info.innerHTML = '';

  const rows = [
    ['Họ và tên', data.name],
    ['Bộ phận', data.department],
    ['Giờ nhân viên chọn', data.selectedTime],
    ['Thời gian hệ thống', data.timestamp]
  ];

  rows.forEach(function(item) {

    const row = document.createElement('div');

    row.className = 'result-row';

    const strong = document.createElement('strong');

    strong.textContent = item[0] + ': ';

    row.appendChild(strong);

    row.appendChild(
      document.createTextNode(String(item[1] || ''))
    );

    info.appendChild(row);

  });

  result.style.display = 'block';

  result.scrollIntoView({
    behavior: 'smooth',
    block: 'center'
  });

}


/************************************************
 * 7. GỬI ĐIỂM DANH ĐẾN GOOGLE APPS SCRIPT
 ************************************************/

function submitAttendance() {

  if (submitted) {
    return;
  }

  if (!wifiVerified) {

    alert('VUI LÒNG KẾT NỐI WIFI CÔNG TY.');

    return;
  }

  if (!cameraStream ||
      !cameraStream.getVideoTracks().some(function(track) {
        return track.readyState === 'live';
      })) {

    alert('VUI LÒNG MỞ CAMERA TRƯỚC KHI ĐIỂM DANH.');

    return;
  }

  const name = document
    .getElementById('employeeName')
    .value.trim();

  const selectedTime = document
    .getElementById('selectedTime')
    .value;

  if (!name) {

    alert('VUI LÒNG NHẬP HỌ VÀ TÊN.');

    return;
  }

  if (!selectedTime) {

    alert('VUI LÒNG CHỌN GIỜ ĐIỂM DANH.');

    return;
  }

  if (CONFIG.API_URL === 'DAN_URL_EXEC_CUA_BAN_VAO_DAY' ||
      !CONFIG.API_URL.endsWith('/exec')) {

    alert(
      'CHƯA CẤU HÌNH URL GOOGLE APPS SCRIPT /exec.'
    );

    return;
  }

  const button = document.getElementById('submitButton');

  button.disabled = true;

  button.innerText = 'ĐANG GHI NHẬN...';

  const callbackName =
    'htSeaproCallback_' + Date.now();

  const script = document.createElement('script');

  const params = new URLSearchParams({
    action: 'attendance',
    name: name,
    time: selectedTime,
    callback: callbackName
  });

  let finished = false;

  const timeout = setTimeout(function() {

    if (finished) return;

    finished = true;

    delete window[callbackName];

    script.remove();

    button.disabled = false;

    button.innerText = 'ĐIỂM DANH';

    alert(
      'Máy chủ phản hồi quá lâu. Vui lòng kiểm tra Google Sheets trước khi thử lại.'
    );

  }, 20000);

  window[callbackName] = function(data) {

    if (finished) return;

    finished = true;

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    button.disabled = false;

    if (data && data.success) {

      submitted = true;

      showResult(data);

      button.innerText = 'ĐÃ ĐIỂM DANH THÀNH CÔNG';

      button.disabled = true;

    } else {

      button.innerText = 'ĐIỂM DANH';

      alert(
        data && data.message
          ? data.message
          : 'KHÔNG THỂ GHI NHẬN ĐIỂM DANH.'
      );

    }

  };

  script.onerror = function() {

    if (finished) return;

    finished = true;

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    button.disabled = false;

    button.innerText = 'ĐIỂM DANH';

    alert(
      'KHÔNG KẾT NỐI ĐƯỢC GOOGLE APPS SCRIPT. VUI LÒNG KIỂM TRA URL /exec VÀ QUYỀN TRIỂN KHAI.'
    );

  };

  script.src =
    CONFIG.API_URL + '?' + params.toString();

  document.body.appendChild(script);

}


/************************************************
 * 8. KHỞI ĐỘNG
 ************************************************/

window.addEventListener('load', function() {

  checkWifi();

});

window.addEventListener('pagehide', function() {

  stopCamera();

});

</script>

</body>
</html>
